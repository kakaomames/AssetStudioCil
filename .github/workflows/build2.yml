name: AssetStudioCLI-Build-Latest

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      # 最新の v4 に換装！
      - uses: actions/checkout@v4
      
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2 # これも最新へ
        
      - name: Setup NuGet
        uses: nuget/setup-nuget@v1
        
      # FBX SDK が必要な場合はここに入れる（不要なら削除して爆速化！）
      - name: Download FBX SDK
        run: |
          md fbx
          cd fbx
          Invoke-WebRequest "https://damassets.autodesk.net/content/dam/autodesk/www/adn/fbx/2020-2-1/fbx202021_fbxsdk_vs2019_win.exe" -OutFile "fbxsdk.exe"
          Start-Process -FilePath "fbxsdk.exe" /S -Wait
          cd ..

      - name: Nuget Restore
        run: nuget restore AssetStudio.sln
      
      # ターゲットを AssetStudioCLI に絞り、ビルドを完遂させる！
      # [修復フェーズ] ネイティブライブラリの存在確認と自動生成
      # [修復フェーズ] ネイティブDLLの強制生成と配置
      - name: Auto-Fix Native Libraries
        run: |
          echo "::group::Native Library Building"
          # まずは確実にネイティブDLLをビルド（x64とWin32両方狙い撃ち）
          msbuild AssetStudio.sln /t:Texture2DDecoderNative /p:Configuration=Release /p:Platform=x64
          msbuild AssetStudio.sln /t:Texture2DDecoderNative /p:Configuration=Release /p:Platform=Win32
          echo "::endgroup::"

          # CLIが「Win32版がない！」と怒っている場所へ、あるものを無理やり供給する
          $targetPath = "D:\a\AssetStudioCil\AssetStudioCil\Texture2DDecoderNative\bin\Win32\Release\"
          if (!(Test-Path $targetPath)) { New-Item -ItemType Directory -Force -Path $targetPath }

          # x64版ができていればそれを、Win32版があればそれをコピー（執念の配置）
          $x64Dll = "Texture2DDecoderNative\bin\x64\Release\Texture2DDecoderNative.dll"
          $win32Dll = "Texture2DDecoderNative\bin\Win32\Release\Texture2DDecoderNative.dll"

          if (Test-Path $x64Dll) {
            Copy-Item -Path $x64Dll -Destination (Join-Path $targetPath "Texture2DDecoderNative.dll") -Force
            echo "[SUCCESS] Placed x64 DLL into Win32 path to satisfy build requirements."
          } elseif (Test-Path $win32Dll) {
            echo "[SUCCESS] Found Win32 DLL."
          } else {
            echo "::error:: Native DLL could not be found anywhere!"
            exit 1
          }

      # [最終フェーズ] CLI本体のビルド
      - name: Final Build AssetStudioCLI
        run: |
          msbuild AssetStudio.sln `
            /t:AssetStudioCLI `
            /p:Configuration=Release `
            /p:TargetFramework=net6.0 `
            /p:Platform="Any CPU" `
            /verbosity:minimal

      # 成果物の保存も最新の v4 へ換装！
      - name: Upload CLI Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AssetStudioModCLI-Latest
          path: AssetStudioCLI/bin/Release/net6.0/publish/

          
