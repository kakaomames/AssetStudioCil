name: AssetStudioCLI-Build-Latest

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      # 最新の v4 に換装！
      - uses: actions/checkout@v4
      
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2 # これも最新へ
        
      - name: Setup NuGet
        uses: nuget/setup-nuget@v1
        
      # FBX SDK が必要な場合はここに入れる（不要なら削除して爆速化！）
      - name: Download FBX SDK
        run: |
          md fbx
          cd fbx
          Invoke-WebRequest "https://damassets.autodesk.net/content/dam/autodesk/www/adn/fbx/2020-2-1/fbx202021_fbxsdk_vs2019_win.exe" -OutFile "fbxsdk.exe"
          Start-Process -FilePath "fbxsdk.exe" /S -Wait
          cd ..

      - name: Nuget Restore
        run: nuget restore AssetStudio.sln
      
      # ターゲットを AssetStudioCLI に絞り、ビルドを完遂させる！
      # [修復フェーズ] ネイティブライブラリの存在確認と自動生成
      - name: Auto-Detect and Build Native Libraries
        run: |
          $nativeDll = "Texture2DDecoderNative\bin\x64\Release\Texture2DDecoderNative.dll"
          if (!(Test-Path $nativeDll)) {
            echo "::warning:: [DETECTED] Native DLL is missing. Starting emergency build..."
            msbuild AssetStudio.sln /t:Texture2DDecoderNative /p:Configuration=Release /p:Platform=x64
          } else {
            echo "[OK] Native DLL already exists."
          }

      # [配置フェーズ] CLIが期待する場所へファイルを強制コピー
      - name: Manual Library Placement
        run: |
          $source = "Texture2DDecoderNative\bin\x64\Release\Texture2DDecoderNative.dll"
          $dest = "AssetStudioCLI\bin\Release\net6.0\"
          if (!(Test-Path $dest)) { New-Item -ItemType Directory -Force -Path $dest }
          Copy-Item -Path $source -Destination $dest -Force
          echo "[ACTION] Native DLL has been force-placed into CLI directory."

      # [最終ビルド] CLI本体のビルド
      - name: Final Build AssetStudioCLI
        run: |
          msbuild AssetStudio.sln `
            /t:AssetStudioCLI `
            /p:Configuration=Release `
            /p:TargetFramework=net6.0 `
            /p:Platform="Any CPU" `
            /verbosity:minimal

      # 成果物の保存も最新の v4 へ換装！
      - name: Upload CLI Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AssetStudioModCLI-Latest
          path: AssetStudioCLI/bin/Release/net6.0/publish/

          
