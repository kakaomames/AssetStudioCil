name: AssetStudioCLI-Build-Latest

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      # 最新の v4 に換装！
      - uses: actions/checkout@v4
      
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2 # これも最新へ
        
      - name: Setup NuGet
        uses: nuget/setup-nuget@v1
        
      # FBX SDK が必要な場合はここに入れる（不要なら削除して爆速化！）
      - name: Download FBX SDK
        run: |
          md fbx
          cd fbx
          Invoke-WebRequest "https://damassets.autodesk.net/content/dam/autodesk/www/adn/fbx/2020-2-1/fbx202021_fbxsdk_vs2019_win.exe" -OutFile "fbxsdk.exe"
          Start-Process -FilePath "fbxsdk.exe" /S -Wait
          cd ..

      - name: Nuget Restore
        run: nuget restore AssetStudio.sln
      

      # [究極フェーズ] 依存関係の解消とCLIビルドをワンステップで完遂
      - name: Ultimate Build Protocol
        run: |
          echo "::group::1. Native Library Emergency Build"
          # エラーが出ても止まらないように実行し、後でパスを合わせる
          msbuild AssetStudio.sln /t:Texture2DDecoderNative /p:Configuration=Release /p:Platform=x64 /verbosity:minimal
          
          # Win32のフリをするためのディレクトリ工作
          $win32Path = "Texture2DDecoderNative\bin\Win32\Release"
          if (!(Test-Path $win32Path)) { New-Item -ItemType Directory -Force -Path $win32Path }
          
          # 生成されたDLLを期待される全方位にコピー
          $generatedDll = "Texture2DDecoderNative\bin\x64\Release\Texture2DDecoderNative.dll"
          if (Test-Path $generatedDll) {
              Copy-Item -Path $generatedDll -Destination (Join-Path $win32Path "Texture2DDecoderNative.dll") -Force
              echo "[SUCCESS] Native DLL synchronized."
          }
          echo "::endgroup::"

          echo "::group::2. Final CLI Assembly"
          # ここで本丸を叩く！
          msbuild AssetStudio.sln `
            /t:AssetStudioCLI `
            /p:Configuration=Release `
            /p:TargetFramework=net6.0 `
            /p:Platform="Any CPU" `
            /verbosity:minimal
          echo "::endgroup::"

      - name: Upload Finished Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AssetStudioModCLI-Final
          path: |
            AssetStudioCLI/bin/Release/net6.0/
            !AssetStudioCLI/bin/Release/net6.0/*.pdb

      # 成果物の保存も最新の v4 へ換装！
      - name: Upload CLI Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AssetStudioModCLI-Latest
          path: AssetStudioCLI/bin/Release/net6.0/publish/

          
