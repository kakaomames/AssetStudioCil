name: AssetStudioCLI-Build-Latest

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      # 最新の v4 に換装！
      - uses: actions/checkout@v4
      
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2 # これも最新へ
        
      - name: Setup NuGet
        uses: nuget/setup-nuget@v1
        
      # FBX SDK が必要な場合はここに入れる（不要なら削除して爆速化！）
      - name: Download FBX SDK
        run: |
          md fbx
          cd fbx
          Invoke-WebRequest "https://damassets.autodesk.net/content/dam/autodesk/www/adn/fbx/2020-2-1/fbx202021_fbxsdk_vs2019_win.exe" -OutFile "fbxsdk.exe"
          Start-Process -FilePath "fbxsdk.exe" /S -Wait
          cd ..

      - name: Nuget Restore
        run: nuget restore AssetStudio.sln
      
      # ターゲットを AssetStudioCLI に絞り、ビルドを完遂させる！
      - name: Build AssetStudioCLI (.Net 6)
        run: |
          msbuild AssetStudio.sln `
            /t:AssetStudioCLI:publish `
            /p:Configuration=Release `
            /p:TargetFramework=net6.0 `
            /p:SelfContained=false `
            /verbosity:minimal

      # 成果物の保存も最新の v4 へ換装！
      - name: Upload CLI Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AssetStudioModCLI-Latest
          path: AssetStudioCLI/bin/Release/net6.0/publish/

          
